name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone handbook corpus (public)
        run: git clone --depth 1 https://github.com/BhagyashriT/java-backend-interview-handbook.git /tmp/corpus

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dataset (validates the full data pipeline, no GPU)
        env:
          PYTHONPATH: src
        run: |
          python data_prep.py --corpus /tmp/corpus --out /tmp/data-check
          test -s /tmp/data-check/train.jsonl
          test -s /tmp/data-check/eval.jsonl

      - name: Unit tests
        run: python -m unittest discover -s tests -v
